name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 🟢 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: ☕ 設定 Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 📦 安裝專案 npm 依賴套件
        run: npm ci

      - name: 🚀 執行 Expo Prebuild
        run: npx expo prebuild --clean

      - name: 🔑 從 Secrets 解密還原 release.keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d -i > android/app/release.keystore

      - name: 🏗️ Gradle 編譯 Release APK
        env:
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 上傳產出的 APK 至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-Keyboard-APK
          path: android/app/build/outputs/apk/release/*.apk
